name: golf_training_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.6

  get:
  shared_preferences:
  flutter_screenutil:
  flutter_svg:
  flutter_spinkit:
  pin_code_fields:
  image_picker:
  internet_connection_checker:
  connectivity_plus:
  fluttertoast:
  flutter_html:
  mime_type:
  cached_network_image:
  intl:
  timeago:
  shimmer:
  path_provider:
  provider:
  photo_view:
  grouped_list:
  webview_flutter:
  dotted_border:
  google_maps_flutter:
  geolocator:
  geocoding:
  table_calendar:
  country_code_picker:
  easy_stepper:
  syncfusion_flutter_calendar:
  flutter_launcher_icons:
  flutter_typeahead:
  google_fonts:
  http:
  http_parser: any

  # ---- Added for the Camera Capture / Review Swing / Analysing flow ----
  # Live camera preview + recording on screens 1-3.
  camera: ^0.11.0+2
  # Clip playback + scrubbing on the Review Swing screen.
  video_player: ^2.9.2
  # Runtime CAMERA / MICROPHONE permission prompts.
  permission_handler: ^11.3.1
  google_mlkit_pose_detection: ^0.15.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  google_sign_in: 6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices.
  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
